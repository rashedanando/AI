<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Neural AI — Next-Gen Intelligence</title>
<style>
:root {
--bg: #07090e;
--card: #0f172a;
--accent: #6366f1;
--accent-glow: rgba(99, 102, 241, 0.4);
--text: #f8fafc;
--muted: #94a3b8;
--border: #1e293b;
--ai-bubble: #1e293b;
--user-bubble: #4f46e5;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background-color: var(--bg); color: var(--text); line-height: 1.6; padding: 1.5rem 1rem; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }

.container { max-width: 850px; margin: 0 auto; width: 100%; }

/* Header & Settings */
header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.logo { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.logo span { color: var(--accent); }
.status-indicator { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #10b981; background: rgba(16, 185, 129, 0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.2); }
.dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

/* API Bar Settings */
.api-config { background: #0f172a; border: 1px dashed var(--border); border-radius: 12px; padding: 0.75rem 1rem; margin: 1rem 0; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
.api-config input { flex: 1; background: #020617; border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.8rem; outline: none; }
.api-config label { color: var(--muted); white-space: nowrap; }

/* AI Interactive Box */
.ai-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); position: relative; }
.chat-box { height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; padding-right: 0.5rem; margin-bottom: 1.2rem; }
.chat-box::-webkit-scrollbar { width: 5px; }
.chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.msg { padding: 0.85rem 1.2rem; border-radius: 14px; max-width: 80%; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.2s ease-in; }
.user-msg { background: var(--user-bubble); color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
.ai-msg { background: var(--ai-bubble); color: var(--text); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid rgba(255,255,255,0.05); }

/* Typing Indicator */
.typing { display: flex; gap: 4px; padding: 0.8rem 1.2rem; background: var(--ai-bubble); border-radius: 14px; width: fit-content; align-self: flex-start; }
.typing span { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
.typing span:nth-child(1) { animation-delay: -0.32s; }
.typing span:nth-child(2) { animation-delay: -0.16s; }

@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* Input Controls */
.input-group { display: flex; gap: 0.5rem; }
input[type="text"] { flex: 1; background: #020617; border: 1px solid var(--border); color: #fff; padding: 0.9rem 1.1rem; border-radius: 10px; outline: none; transition: 0.2s; font-size: 0.95rem; }
input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
button { background: var(--accent); color: white; border: none; padding: 0.9rem 1.5rem; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
button:hover { background: #4338ca; }

/* Quick Chips */
.chips { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
.chip { background: rgba(255, 255, 255, 0.03); font-size: 0.8rem; padding: 0.4rem 0.8rem; border-radius: 20px; cursor: pointer; border: 1px solid var(--border); color: var(--muted); transition: 0.2s; }
.chip:hover { border-color: var(--accent); color: var(--text); background: rgba(99, 102, 241, 0.1); }
</style>
</head>
<body>

<div class="container">
<header>
<div class="logo">⚡ Aura<span>Brain AI</span></div>
<div class="status-indicator"><div class="dot"></div> Engine Active</div>
</header>

<!-- Optional Live OpenAI Key Integration -->
<div class="api-config">
<label for="apiKey">🔑 Live Brain Mode (Optional Key):</label>
<input type="password" id="apiKey" placeholder="Paste OpenAI API Key (sk-...) for live deep thinking">
</div>

<main class="ai-card">
<div class="chat-box" id="chatBox">
<div class="msg ai-msg">Greetings! I am Aura's neural engine. Ask me any complex business query, coding task, or strategic decision.</div>
</div>

<div class="input-group">
<input type="text" id="userInput" placeholder="Type a message or command..." onkeydown="if(event.key==='Enter') sendQuestion()">
<button onclick="sendQuestion()">Send 🚀</button>
</div>

<div class="chips">
<div class="chip" onclick="quickAsk('Write a Python script to filter customer leads')">🐍 Python Lead Filter</div>
<div class="chip" onclick="quickAsk('Analyze risk factors for launching a SaaS product')">📊 SaaS Risk Analysis</div>
<div class="chip" onclick="quickAsk('What makes your platform different?')">💡 Core Differentiators</div>
</div>
</main>
</div>

<script>
// Advanced Built-in NLP Reasoning Brain (Fallback when no API Key is provided)
const Memory = { userContext: [] };

function evaluateLocalBrain(query) {
const q = query.toLowerCase();
Memory.userContext.push(query);

// Code Generation
if (q.includes("python") || q.includes("code") || q.includes("script")) {
return "Here is an optimized algorithm for your request:\n\n" +
"python\n" + "def process_leads(leads, min_score=75):\n" + " # Automated Lead Qualification Pipeline\n" + " qualified = [l for l in leads if l.get('score', 0) &gt;= min_score]\n" + " return sorted(qualified, key=lambda x: x['score'], reverse=True)\n" + "\n" +
"This pipeline filters non-performing leads while sorting high-intent opportunities first.";
}

// Business & Strategic Analysis
if (q.includes("saas") || q.includes("risk") || q.includes("business") || q.includes("strategy")) {
return "Strategic Risk Evaluation Framework:\n\n" +
"1. Customer Acquisition Cost (CAC) Inflation: High initial ad spend without organic retention validation.\n" +
"2. Churn Volatility: Inadequate onboarding flow during the first 14 days.\n" +
"3. Technical Scalability: Database bottlenecks during peak API request volumes.\n\n" +
"Mitigation: Implement dynamic feature toggles and multi-region database redundancy.";
}

// Core Platform & Capabilities
if (q.includes("different") || q.includes("features") || q.includes("what can you do")) {
return "Aura AI utilizes sub-100ms latency neural models with native memory retention. Key advantages:\n\n" +
"• Context Awareness: Analyzes past messages to synthesize contextual decisions.\n" +
"• Zero-Retention Encryption: End-to-end data privacy with zero model retraining.\n" +
"• Multi-Agent Coordination: Automatic routing between specialized workflow micro-agents.";
}

// Conversational & Contextual Fallback Engine
if (q.includes("hello") || q.includes("hi") || q.includes("hey")) {
return "Hello! I am ready to assist. You can ask me to draft code, evaluate business models, or automate daily operations.";
}

return I evaluated your input ("${query}"). Based on multi-factor analysis: standard operational protocols recommend automating routine triage, structuring data pipelines into scalable APIs, and maintaining strict sub-second response parameters. How would you like to expand on this topic?`;
}

// Real LLM API Integration (OpenAI API Bridge)
async function fetchLiveAIResponse(userMessage, apiKey) {
try {
const res = await fetch("https://api.openai.com/v1/chat/completions", {
method: "POST",
headers: {
"Content-Type": "application/json",
"Authorization": Bearer${apiKey}`
},
body: JSON.stringify({
model: "gpt-4o-mini",
messages: [
{ role: "system", content: "You are an ultra-smart, concise, premium enterprise AI assistant for a cutting-edge tech company." },
{ role: "user", content: userMessage }
 ],
temperature: 0.7
})
});
const data = await res.json();
if (data.choices && data.choices[0]) {
return data.choices[0].message.content;
} else {
return "API Error: " + (data.error?.message || "Invalid API response.");
}
} catch (err) {
return "Network Error connecting to AI endpoint: " + err.message;
}
}

// UI Event Handler
async function sendQuestion() {
const input = document.getElementById("userInput");
const query = input.value.trim();
if (!query) return;

appendMessage(query, "user-msg");
input.value = "";

const typingId = showTyping();
const apiKey = document.getElementById("apiKey").value.trim();

let reply = "";
if (apiKey) {
reply = await fetchLiveAIResponse(query, apiKey);
} else {
// Artificial delay to simulate neural processing
await new Promise(r => setTimeout(r, 700));
reply = evaluateLocalBrain(query);
}

removeTyping(typingId);
appendMessage(reply, "ai-msg");
}

function quickAsk(text) {
document.getElementById("userInput").value = text;
sendQuestion();
}

function appendMessage(text, className) {
const chatBox = document.getElementById("chatBox");
const msgDiv = document.createElement("div");
msgDiv.className = msg ${className};
msgDiv.innerText = text;
chatBox.appendChild(msgDiv);
chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping() {
const chatBox = document.getElementById("chatBox");
const typingDiv = document.createElement("div");
const id = "typing-" + Date.now();
typingDiv.id = id;
typingDiv.className = "typing";
typingDiv.innerHTML = "<span></span><span></span><span></span>";
chatBox.appendChild(typingDiv);
chatBox.scrollTop = chatBox.scrollHeight;
return id;
}

function removeTyping(id) {
const el = document.getElementById(id);
if (el) el.remove();
}
</script>

</body>
</html>
